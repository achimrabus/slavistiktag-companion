<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slavistiktag 2026 · Themen-Kompass</title>
  <meta name="description" content="Data-Mining-Ansicht zum Programm des 15. Deutschen Slavistiktags 2026 in Jena: Vorträge automatisch nach Themenfeldern gruppiert.">
  <meta name="theme-color" content="#101426">
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("slavtag26.theme"); } catch (e) {}
      var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/themen">
      <span class="brand-mark">Сл</span>
      <span class="brand-text">Slavistiktag <strong>2026</strong> · Themen-Kompass</span>
    </a>
    <nav id="main-nav" class="main-nav" aria-label="Hauptnavigation"></nav>
    <button id="theme-toggle" class="theme-toggle" aria-label="Farbschema wechseln" title="Dark/Light umschalten"></button>
  </header>
  <main id="app" class="app-main"></main>
  <footer class="site-footer">
    <p>
      Companion zur inoffiziellen <a href="https://achimrabus.github.io/slavistiktag-2026-programm-app/" target="_blank" rel="noopener">Programm-App</a> zum
      <a href="https://www.gw.uni-jena.de/52745/15-slavistiktag-2026" target="_blank" rel="noopener">15. Deutschen Slavistiktag</a> ·
      Daten aus dem <a href="https://www.gw.uni-jena.de/phifakmedia/195800/vortraege.pdf" target="_blank" rel="noopener">Tagungsprogramm-PDF</a> der FSU Jena ·
      App: <a href="https://github.com/achimrabus" target="_blank" rel="noopener">Achim Rabus</a>
    </p>
  </footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
