name: Programm-Update prüfen

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: program-update
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: pip install pdfplumber

      - name: PDF laden (mit URL-Fallback) und Hash vergleichen
        id: check
        run: |
          set -euo pipefail
          PRIMARY="https://www.gw.uni-jena.de/phifakmedia/195800/vortraege.pdf"
          DOWNLOADS="https://www.gw.uni-jena.de/52756/downloads"
          PDF=/tmp/vortraege.pdf
          FINAL_URL=""

          # Ein valides Kandidaten-PDF: nicht leer, >= 50 kB, echte %PDF-Magie
          validate() {
            [ -s "$1" ] || return 1
            local size; size=$(wc -c < "$1")
            [ "$size" -ge 50000 ] || return 1
            head -c 5 "$1" | grep -q '%PDF-'
          }

          try_url() {
            local code
            code=$(curl -sSL --retry 3 --retry-delay 15 --retry-all-errors \
                   -w '%{http_code}' -o "$PDF" "$1" 2>/dev/null) || code=000
            [ "$code" = "200" ] && validate "$PDF"
          }

          echo "::group::Primäre URL"
          if try_url "$PRIMARY"; then
            FINAL_URL="$PRIMARY"
            echo "Primäre URL ok: $PRIMARY"
          fi
          echo "::endgroup::"

          # Fallback: Downloads-Seite der Tagung nach vortraege/programm-PDFs durchsuchen
          if [ -z "$FINAL_URL" ]; then
            echo "::warning::Primäre URL liefert kein valides PDF: $PRIMARY — Fallback: Downloads-Seite scrapen."
            echo "::group::Fallback: Downloads-Seite"
            curl -sSL --compressed --retry 3 -o /tmp/downloads.html "$DOWNLOADS" || true
            CANDIDATES=$(grep -oE 'phifakmedia/[0-9]+/[^"<>[:space:]]*(vortraege|programm)[^"<>[:space:]]*\.pdf' /tmp/downloads.html \
              | sed 's|^|https://www.gw.uni-jena.de/|' | sort -u)
            echo "Kandidaten: ${CANDIDATES:-keine}"
            while IFS= read -r cand; do
              [ -n "$cand" ] || continue
              if try_url "$cand"; then
                FINAL_URL="$cand"
                echo "Fallback-URL ok: $cand"
                break
              fi
              echo "Kandidat unbrauchbar: $cand"
            done <<< "$CANDIDATES"
            echo "::endgroup::"
          fi

          if [ -z "$FINAL_URL" ] || ! validate "$PDF"; then
            echo "::error::QUELLE BROKEN – weder die primäre URL noch ein Fallback-Kandidat liefert ein valides PDF. Programm-Update übersprungen, alte Daten bleiben online."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "broken=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$FINAL_URL" != "$PRIMARY" ]; then
            echo "::warning::FALLBACK AKTIV: Programm wird von $FINAL_URL geladen. Bitte die PRIMARY-Zeile in .github/workflows/update.yml auf diese URL setzen – sonst läuft jeder Lauf über den Fallback."
          fi
          echo "final_url=$FINAL_URL" >> "$GITHUB_OUTPUT"

          NEW_SHA=$(sha256sum "$PDF" | cut -d' ' -f1)
          OLD_SHA=$(python -c "import json; print(json.load(open('data/program.json', encoding='utf-8'))['meta']['source_sha256'])")
          echo "new_sha=$NEW_SHA" >> "$GITHUB_OUTPUT"
          echo "old_sha=$OLD_SHA" >> "$GITHUB_OUTPUT"
          if [ "$NEW_SHA" = "$OLD_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "PDF unverändert (sha256 $NEW_SHA)"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "PDF geändert: $OLD_SHA -> $NEW_SHA"
          fi

      - name: Alarm bei nicht erreichbarer Quelle
        if: steps.check.outputs.broken == 'true'
        run: |
          echo "::error::QUELLE BROKEN – Programm-Update übersprungen, alte Daten bleiben online."
          echo "Die App funktioniert weiter mit dem letzten validen Stand (inkl. LLM-Themen-Tags)."
          echo "Der Fallback (Downloads-Seite) wurde bereits versucht und fand kein valides PDF."
          echo "Handlung: Auf gw.uni-jena.de prüfen, ob das Programm umgezogen ist oder ein"
          echo "neues Dateiformat/Name eingeführt wurde, dann PRIMARY in update.yml anpassen."

      - name: Neues PDF archivieren und parsen
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          STAND=$(date +%F)
          DEST="tools/source/vortraege_${STAND}.pdf"
          cp /tmp/vortraege.pdf "$DEST"
          python tools/parse_program.py "$DEST" -o data/program.json

      - name: Validierung (Gate)
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python - <<'EOF'
          import json, sys
          p = json.load(open("data/program.json", encoding="utf-8"))
          sessions = p.get("sessions", [])
          panels = p.get("panels", [])
          talks = [s for s in sessions if s.get("type") == "talk"]
          blocks = p.get("blocks", [])
          rooms = {s.get("room") for s in sessions if s.get("room")}
          problems = []
          if len(talks) < 250: problems.append(f"nur {len(talks)} Vorträge (Mindestanzahl 250)")
          if len(panels) < 80: problems.append(f"nur {len(panels)} Panels (Mindestanzahl 80)")
          if not blocks: problems.append("keine Zeitblöcke erkannt")
          for s in sessions:
              if not s.get("day") or not s.get("start"):
                  problems.append(f"Session ohne Tag/Zeit: {s.get('id')}")
                  break
          # Raumplan-Konsistenz: unbekannte Räume blockieren nicht, aber sichtbar machen
          import re
          known = set()
          try:
              txt = open("js/rooms.js", encoding="utf-8").read()
              known = set(re.findall(r'"(HS \d|SR \d+|MMZ \d+|Foyer[^"]*|Aula[^"]*)":', txt))
          except FileNotFoundError:
              problems.append("js/rooms.js fehlt – Raum-Mapping kann nicht geprüft werden")
          if known:
              new_rooms = rooms - known
              if new_rooms:
                  print("HINWEIS – neue Räume ohne Karten-Link:", sorted(new_rooms))
          if problems:
              print("VALIDIERUNG FEHLGESCHLAGEN – kein Deploy:")
              for pr in problems: print(" -", pr)
              sys.exit(1)
          print(f"Validierung OK: {len(talks)} Vorträge, {len(panels)} Panels, {len(blocks)} Blöcke, {len(rooms)} Räume")
          print("Warnings:", json.dumps(p.get("meta", {}).get("warnings", []), ensure_ascii=False))
          EOF

      - name: Commit und Push (löst Pages-Neubau aus)
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/program.json tools/source/
          git commit -m "Programm-Update: PDF-Stand $(date +%F) (sha256 ${NEW_SHA:0:8})" \
                     -m "Quelle: $FINAL_URL · vorher: ${OLD_SHA:0:8}"
          git push
        env:
          NEW_SHA: ${{ steps.check.outputs.new_sha }}
          OLD_SHA: ${{ steps.check.outputs.old_sha }}
          FINAL_URL: ${{ steps.check.outputs.final_url }}
